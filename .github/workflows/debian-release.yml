name: Debian Package Build & Release
on:
  release:
    types: [published] # Triggers automatically when you publish a GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            toolchain: ""
            flags: ""
            image: "debian:sid"
          - arch: armel
            toolchain: "gcc-arm-linux-gnueabi"
            flags: ""
            image: "debian:trixie"
          - arch: armhf
            toolchain: "gcc-arm-linux-gnueabihf"
            flags: ""
            image: "debian:sid"
          - arch: arm64
            toolchain: "gcc-aarch64-linux-gnu"
            flags: ""
            image: "debian:sid"
          - arch: i386
            toolchain: "crossbuild-essential-i386"
            flags: "export DEB_CFLAGS_SET='-march=i686 -mtune=generic'"
            image: "debian:sid"
          - arch: ppc64el
            toolchain: "gcc-powerpc64le-linux-gnu"
            flags: ""
            image: "debian:sid"

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Identity
        id: ident
        run: |
          apt --update install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV

      - name: Set Version from Tag
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Print environment variables for debugging
        run: env | sort

      - name: Configure Foreign Architecture and Base Toolchains
        run: |
          apt -y install debhelper devscripts lintian equivs
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            dpkg --add-architecture ${{ matrix.arch }}
            apt --update install -y crossbuild-essential-${{ matrix.arch }}
          fi
          if [ -n "${{ matrix.toolchain }}" ]; then
            apt -y install ${{ matrix.toolchain }}
          fi

      - name: Resolve Architecture Dependencies and Build Package
        env:
          DEBFULLNAME: ${{ env.NAME }}
          DEBEMAIL: ${{ env.EMAIL }}
          VERSION: ${{ env.VERSION }}
        run: |
          ${{ matrix.flags }}
          PRISTINE_VERSION=$(echo $VERSION | cut -d'-' -f1)
          tar --exclude=./debian -cJf ../overlayfs-tools_${PRISTINE_VERSION}.orig.tar.xz .
          dch -v $VERSION --distribution unstable --force-distribution --force-bad-version "Automated release from GitHub Tag"
          
          mk-build-deps -ir -B -t "apt -y --no-install-recommends -o Debug::pkgProblemResolver=yes" --host-arch ${{ matrix.arch }} --build-arch amd64
          dpkg-buildpackage -a ${{ matrix.arch }} -us -uc -b

      - name: Stage Release Artifacts
        run: |
          mkdir -p staging_dir
          mv ../overlayfs-tools_*_${{ matrix.arch }}.deb staging_dir/ || true
          mv ../overlayfs-tools-dbgsym_*_${{ matrix.arch }}.deb staging_dir/ || true

      - name: Upload Architecture Package to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: staging_dir/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
