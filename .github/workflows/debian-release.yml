name: Debian Package Build & Release
on:
  push:
    tags:
      - 'v*' # Triggers a Release when you push a tag like v1.0-1
    branches:
      - debian/sid

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set Version from Tag
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          # Update changelog using dch (part of devscripts)
          # We do this outside the docker container first or inside it.
          # Best to do it inside the build step:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Test Package
        uses: docker://debian:sid
        with:
          args: |
            sh -c "apt-get update && \
            apt-get install -y build-essential debhelper devscripts lintian && \
            # --- PULL IDENTITY FROM GIT ---
            export DEBFULLNAME='$(git log -1 --pretty=format:'%an')' && \
            export DEBEMAIL='$(git log -1 --pretty=format:'%ae')' && \
            # --- AUTO VERSIONING ---
            VERSION=${GITHUB_REF_NAME#v}
            dch -v ${VERSION} --distribution unstable --force-distribution 'Automated release from GitHub Tag' && \
            # --- NORMAL BUILD ---
            mk-build-deps -ir -t 'apt-get -y' && \
            dpkg-buildpackage -us -uc -b && \
            echo '--- RUNNING LINTIAN ---' && \
            lintian ../*.deb && \
            echo '--- RUNNING BASIC INSTALL TEST ---' && \
            dpkg -i ../*.deb && \
            mv ../*.deb ./"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: ./*.deb

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./*.deb
          generate_release_notes: true
