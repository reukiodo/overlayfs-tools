name: Debian Package Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cross_arch: ""
            toolchain: ""
            flags: ""
          - arch: armel
            cross_arch: "armel"
            toolchain: "gcc-arm-linux-gnueabi"
            flags: ""
          - arch: armhf
            cross_arch: "armhf"
            toolchain: "gcc-arm-linux-gnueabihf"
            flags: ""
          - arch: arm64
            cross_arch: "arm64"
            toolchain: "gcc-aarch64-linux-gnu"
            flags: ""
          - arch: i386
            cross_arch: "i386"
            toolchain: "gcc-multilib"
            flags: "export DEB_CFLAGS_SET='-march=i686 -mtune=generic'"
          - arch: ppc64el
            cross_arch: "ppc64el"
            toolchain: "gcc-powerpc64le-linux-gnu"
            flags: ""

    container:
      image: debian:sid

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Identity
        id: ident
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV

      - name: Configure Foreign Architecture and Base Toolchains
        run: |
          apt-get install -y debhelper devscripts lintian equivs
          
          # Conditionally register foreign architecture configurations
          if [ -n "${{ matrix.cross_arch }}" ]; then
            dpkg --add-architecture ${{ matrix.cross_arch }}
            apt-get update
            apt-get install -y crossbuild-essential-${{ matrix.cross_arch }} libattr1-dev:${{ matrix.cross_arch }}
          fi
          
          # Conditionally install target cross-compilers or compiler helpers
          if [ -n "${{ matrix.toolchain }}" ]; then
            apt-get install -y ${{ matrix.toolchain }}
          fi

      - name: Resolve Architecture Dependencies and Build Package
        env:
          DEBFULLNAME: ${{ env.NAME }}
          DEBEMAIL: ${{ env.EMAIL }}
        run: |
          # Inject performance overrides (such as down-tuning i386 to i686 execution limits)
          ${{ matrix.flags }}
          
          # Resolve build-dependencies safely across cross-compilation layers
          if [ -n "${{ matrix.cross_arch }}" ]; then
            mk-build-deps -ir -B -t "apt-get -y --no-install-recommends -o Debug::pkgProblemResolver=yes" --host-arch ${{ matrix.cross_arch }} --build-arch amd64
            dpkg-buildpackage -a ${{ matrix.cross_arch }} -us -uc -b
          else
            mk-build-deps -ir -t "apt-get -y --no-install-recommends"
            dpkg-buildpackage -us -uc -b
          fi

      - name: Run Downstream Lintian & Installation Sanity Pass
        run: |
          echo "=== Executing Package Lint Rules Check ==="
          lintian ../*.deb
          
          echo "=== Simulating Local Package Extraction Tests ==="
          if [ -z "${{ matrix.cross_arch }}" ]; then
            # Filter wildcards using grep -v to safely bypass the -dbgsym package files
            for pkg in $(ls ../*.deb | grep -v "dbgsym"); do
              dpkg -i "$pkg"
            done
          else
            echo "Skipping native installation pass execution for cross-compiled asset: ${{ matrix.arch }}"
            for pkg in $(ls ../*_${{ matrix.arch }}.deb | grep -v "dbgsym"); do
              dpkg --info "$pkg"
            done
          fi
