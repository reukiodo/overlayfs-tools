name: Debian Package Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Piuparts Test
        uses: docker://debian:sid
        with:
          # We need privileged mode for piuparts to mount filesystems inside the container
          args: |
            sh -c "apt-get update && \
            apt-get install -y build-essential debhelper devscripts lintian piuparts && \
            mk-build-deps -ir -t 'apt-get -y' && \
            dpkg-buildpackage -us -uc -b && \
            echo '--- RUNNING LINTIAN ---' && \
            lintian ../*.deb && \
            echo '--- RUNNING PIUPARTS ---' && \
            piuparts ../*.deb"
